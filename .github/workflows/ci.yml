name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Unit tests
        run: make test
      - name: Smoke
        run: |
          ./json-mini --validate --file samples/example.json
          ./json-mini --pretty --file samples/example.json | grep -q '"json-mini"'
